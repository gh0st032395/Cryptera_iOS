name: Cryptera
options:
  bundleIdPrefix: com.cryptera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # L'inglese è la lingua sorgente: le chiavi di localizzazione **sono** le
  # stringhe inglesi, quindi non esiste un `en.lproj` da mantenere e una chiave
  # senza traduzione ricade sull'inglese invece di mostrare un identificatore.
  developmentLanguage: en
  # Il .xcodeproj è rigenerato da questo file e non è committato: è il motivo
  # per cui si usa XcodeGen (SPEC §3.1 — i .pbxproj producono conflitti di
  # merge illeggibili).
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # L'app non fa richieste di rete (SPEC §12.4) e non usa dipendenze esterne
    # oltre all'XCFramework locale.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Cryptera:
    type: application
    platform: iOS
    sources:
      - path: Cryptera
        excludes:
          - "**/.gitkeep"
      # Fixture dell'upstream disponibili all'app **solo in Debug**.
      #
      # Servono ai flussi di test: da M4 l'input arriva da `.fileImporter`, che
      # è UI di sistema e fuori processo, quindi avere file di prova dentro
      # l'app resta il modo più pratico per pilotare un UI test.
      #
      # In Release non servono a nulla — lì non gira alcun test — e sono dati di
      # test che non devono raggiungere una build distribuibile. L'esclusione è
      # nei settings del target qui sotto.
      - path: CrypteraTests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryptera.ios
        INFOPLIST_FILE: Cryptera/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # L'icona è generata da `scripts/make-app-icon.swift`, non disegnata a
        # mano: senza questa chiave l'asset catalog verrebbe compilato ma
        # l'icona non assegnata, e l'app mostrerebbe il segnaposto di sistema.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Header dell'FFI: i binding generati fanno `import cryptera_ffiFFI`,
        # che risolve tramite il module.modulemap dentro l'XCFramework.
        SWIFT_INCLUDE_PATHS: $(inherited)
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # Le fixture restano fuori dalle build distribuibili.
        #
        # La verifica non è esprimibile come XCTest: `@testable import` richiede
        # ENABLE_TESTABILITY, disattivata in Release, e attivarla lì sarebbe
        # sbagliato. Il controllo vive quindi in
        # `scripts/check-release-bundle.sh`, che ispeziona il .app prodotto.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: Fixtures
    dependencies:
      # Libreria statica: si linka, non si embedda.
      - framework: Frameworks/CrypteraCore.xcframework
        embed: false

  CrypteraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CrypteraUITests
    dependencies:
      - target: Cryptera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryptera.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

  CrypteraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrypteraTests
        excludes:
          - "**/.gitkeep"
          - "Fixtures/**"
      # I .ecf non hanno un tipo noto a Xcode: senza buildPhase esplicita
      # finirebbero fuori dal bundle e i test di compatibilità (M7) fallirebbero
      # con "fixture non trovata" invece che per una ragione reale.
      - path: CrypteraTests/Fixtures
        type: folder
        buildPhase: resources
      # File prodotti dall'**applicazione desktop** e congelati (M7 punto 3).
      #
      # Restano fuori dal bundle dell'app: servono solo ai test, e
      # `check-release-bundle.sh` fallisce se un `.ecf` finisce in una build
      # distribuibile.
      - path: CrypteraTests/CrossFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Cryptera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryptera.ios.tests
        # Il bundle di test non ha requisiti di Info.plist propri (niente UTI,
        # niente document types), quindi lo si lascia generare a Xcode.
        GENERATE_INFOPLIST_FILE: YES
